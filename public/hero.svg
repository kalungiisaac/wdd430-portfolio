<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of a chapel on the ridge</title>
  <desc id="desc">A stylized white chapel with a tall spire on green hills beneath a soft blue sky and warm sun.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fc3e8"/>
      <stop offset="100%" stop-color="#f6e7c9"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3bd85"/>
      <stop offset="100%" stop-color="#8aa76a"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ba05b"/>
      <stop offset="100%" stop-color="#5a7c44"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>
  <circle cx="660" cy="82" r="34" fill="#ffd97a"/>
  <circle cx="280" cy="60" r="14" fill="rgba(255,255,255,0.55)"/>
  <circle cx="520" cy="120" r="10" fill="rgba(255,255,255,0.45)"/>
  <path d="M0 400 Q 160 300 360 312 T 800 300 L 800 400 Z" fill="url(#hillFar)"/>
  <path d="M0 400 Q 220 330 560 340 T 800 396 L 800 400 Z" fill="url(#hillNear)"/>

  <g>
    <!-- chapel body -->
    <rect x="300" y="225" width="200" height="78" fill="#fdfcfb" stroke="#cbbfae" stroke-width="2"/>
    <!-- body roof -->
    <path d="M 282 228 L 400 158 L 518 228 Z" fill="#5a6b52" stroke="#44553c" stroke-width="2"/>
    <!-- spire -->
    <rect x="384" y="112" width="32" height="116" fill="#fdfcfb" stroke="#cbbfae" stroke-width="2"/>
    <path d="M 376 116 L 400 62 L 424 116 Z" fill="#44553c"/>
    <line x1="400" y1="44" x2="400" y2="74" stroke="#b48a3c" stroke-width="4"/>
    <line x1="384" y1="58" x2="416" y2="58" stroke="#b48a3c" stroke-width="4"/>
    <!-- spire window -->
    <rect x="395" y="150" width="10" height="18" rx="5" fill="#9fc3e8"/>
    <!-- door -->
    <rect x="378" y="262" width="44" height="41" fill="#5a4128" stroke="#3f2d1a" stroke-width="2" rx="2"/>
    <rect x="396" y="276" width="8" height="12" fill="#b48a3c"/>
    <circle cx="388" cy="296" r="1.5" fill="#e8dfc8"/>
    <circle cx="412" cy="296" r="1.5" fill="#e8dfc8"/>
    <!-- windows -->
    <rect x="322" y="252" width="22" height="28" rx="11" fill="#9fc3e8" stroke="#cbbfae" stroke-width="2"/>
    <rect x="456" y="252" width="22" height="28" rx="11" fill="#9fc3e8" stroke="#cbbfae" stroke-width="2"/>
    <!-- steps -->
    <path d="M 372 303 h 56 l 0 4 h 66 l 0 4 h -96 z" fill="#e3dccb"/>
    <path d="M 362 307 h 76 l 0 4 h 84 l 0 4 h -112 z" fill="#d2c7ae"/>
  </g>
</svg>