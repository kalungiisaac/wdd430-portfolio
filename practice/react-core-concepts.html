<!--
A component is a reusable function that returns JSX to describe part of a user interface.
Props are values passed from a parent component to a child component so each component can be customized without changing its logic.
State holds data that can change over time, and when state updates with a setter function, React re-renders the component so the UI reflects the new values.
-->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Core Concepts Practice</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/jsx">
      function Greeting(props) {
        return <h2>Welcome aboard, {props.name}!</h2>;
      }

      function Counter() {
        const [count, setCount] = React.useState(0);

        return (
          <section>
            <h3>Counter Example</h3>
            <p>Current count: {count}</p>
            <button onClick={() => setCount(count + 1)}>Increment</button>
          </section>
        );
      }

      function App() {
        return (
          <main>
            <h1>React Core Concepts</h1>
            <Greeting name="Kalungi Isaac" />
            <Counter />
          </main>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>

</html>
